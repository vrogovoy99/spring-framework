spring:
  application:
    name: task-service
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/micro-task
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    initialization-mode: always

server:
  port: 8083

keycloak:
  realm: cydeo-dev
  auth-server-url: http://localhost:8080/auth
  ssl-required: none
  resource: ticketing-app
  credentials:
    secret: kL61LtbhRQ4i8wKM6M0QDHpYEF7utx3K
  use-resource-role-mappings: true
  bearer-only: true

master:
  user:
    username: admin
    password: admin
  realm: master
  client: master-client

#register Eureka server to register this api service
eureka:
  instance:
    #    IP configuration is optional to avoid long autogenerated server names.
    preferIpAddress: true
    ipAddress: 127.0.0.1
    status-page-url-path: ${management.context-path}/info
    health-check-url-path:  ${management.context-path}/health
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
# define path to provide Eureka Actuator with the details of this service
management:
  endpoint:
    health:
      show-details: "ALWAYS"
  endpoints:
    web:
      exposure:
        include: "*"
  context-path: http://localhost:${server.port}/actuator
# provide Eureka service with details of this api app
info:
  application:
    name: task-service
    description: Ticketing Application Task Service
