spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.address}/auth/realms/cydeo-dev

keycloak:
  address: http://localhost:8080

server:
  port: 8762

#register Eureka server to register this api service
eureka:
  instance:
    #    IP configuration is optional to avoid long autogenerated server names.
    preferIpAddress: true
    ipAddress: 127.0.0.1
    status-page-url-path: ${management.context-path}/info
    health-check-url-path:  ${management.context-path}/health
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
# define path to provide Eureka Actuator with the details of this service
management:
  endpoint:
    health:
      show-details: "ALWAYS"
  endpoints:
    web:
      exposure:
        include: "*"
  context-path: http://localhost:${server.port}/actuator
# provide Eureka service with details of this api app
info:
  application:
    name: gateway-service
    description: Ticketing Application Gateway Service
# display API documentation to gateway clients
springdoc:
  swagger-ui:
    urls[0]:
      name: User Service API Doc
      url: /user-service/v3/api-docs
    urls[1]:
      name: Project Service API Doc
      url: /project-service/v3/api-docs
    urls[2]:
      name: Task Service API Doc
      url: /task-service/v3/api-docs